name: Deploy REFRAMAX

# Publicação automática: cada push monta a versão nova e a coloca no ar em
# https://reframax-tempos-e-metodos.netlify.app. A Netlify troca a versão de
# uma vez só quando o envio termina — o app não sai do ar e o link não muda.

on:
  push:
    branches:
      - main
      - claude/industrial-time-methods-system-2sgf0q
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar no app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # opcional: chave do reCAPTCHA v3 para o App Check (vazia = desligado)
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}

      - name: Publicar na Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 43bcdadd-1e0c-4860-9beb-53b309fae2e5
        run: npx --yes netlify-cli@17 deploy --dir=dist --prod --message "${GITHUB_SHA::7}"

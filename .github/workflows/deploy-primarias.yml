name: Deploy Primárias

# Publicação automática do app Primárias: cada push que mexe nele monta a
# versão nova e a coloca no ar em https://reframax-primarias.netlify.app.
# A Netlify troca a versão de uma vez só quando o envio termina.

on:
  push:
    branches:
      - main
      - claude/gifted-johnson-dt0qa6
    paths:
      - 'primarias/**'
      - 'src/utils/**'
      - 'src/components/ui.js'
      - 'src/lib/toast.js'
      - 'src/styles/**'
      - 'netlify/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-primarias.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-primarias
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o Primárias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:primarias
        env:
          # o mesmo Firebase do Tempos & Métodos (login por matrícula e banco)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # opcional: chave do reCAPTCHA v3 para o App Check (vazia = desligado)
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}

      - name: Publicar na Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 497192f5-083b-4633-b1d0-af935b286636
        run: npx --yes netlify-cli@17 deploy --dir=dist-primarias --functions=netlify/functions --prod --message "${GITHUB_SHA::7}"

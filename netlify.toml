# Netlify — este repositório publica dois sites:
#   https://reframax-tempos-e-metodos.netlify.app (Tempos & Métodos, raiz do repo)
#   https://reframax-primarias.netlify.app        (Primárias, pasta primarias/)
# Os cabeçalhos (cache e quem pode exibir o app dentro de outra página)
# ficam em public/_headers e primarias/public/_headers, que vão junto no build.
# Quando a própria Netlify monta o site, o nome do site decide qual app sai em dist/.
[build]
  command = "if [ \"$SITE_NAME\" = \"reframax-primarias\" ]; then PRIMARIAS_SAIDA=../dist npm run build:primarias; else npm run build; fi"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# Funções do servidor (ex.: /api/senha, redefinição de senha pelo administrador).
# O firebase-admin vai inteiro, sem empacotar, porque carrega arquivos em tempo de execução.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]
